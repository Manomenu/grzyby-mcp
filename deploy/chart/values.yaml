# Defaults. The image tag is empty on purpose: the platform repo sets it, because it decides
# what runs. A tag hard-coded here would make a code commit a deployment at the same time.

image:
  registry: ghcr.io/manomenu/grzyby-mcp
  tag: "" # e.g. sha-a1b2c3d — set by the Argo Application
  pullPolicy: IfNotPresent
  # A docker-registry Secret in the release namespace, for a private registry. The platform
  # repo creates it (scripts/projects/…/setup.sh); empty = pull without logging in.
  pullSecret: ""

server:
  replicas: 1
  port: 6210
  # A Secret with DATABASE_URL in the release namespace, created by the platform repo. Without
  # a database the server deliberately does not start.
  databaseSecret: ""
  # A Secret with MCP_KEY — the key /mcp asks for (grzyby_server/mcp_key.py), created by the
  # platform repo. Empty = /mcp open, which is only for a laptop.
  mcpKeySecret: ""
  # Open /mcp to anyone while keeping the key: true lets requests without it through; false puts
  # the key back in charge. The platform repo decides, per environment.
  allowPublic: false
  # Extra Host headers /mcp answers to (the SDK's DNS-rebinding guard). The ingress host and the
  # web Service's own name (the smoke test calls through it) are always allowed.
  mcpHosts: []
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }

# Monthly refresh of the forest data asked about so far (templates/importer.yaml): a few seconds
# per tile, a tile at a time in the database, so memory stays small.
importer:
  schedule: "0 4 1 * *" # 04:00 on the 1st of every month, Polish time
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }

web:
  replicas: 1
  port: 8080
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

# Checked after every deploy (templates/smoke-test.yaml): a Job Argo runs after each sync.
smokeTest:
  enabled: true
  image: docker.io/curlimages/curl:8.22.0

ingress:
  enabled: true
  className: traefik
  host: grzyby.k8s.example.internal
