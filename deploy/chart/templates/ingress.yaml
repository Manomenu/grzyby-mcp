{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    # Tylko web. Ruch na /api rozstrzyga nginx wewnątrz tego poda — jedna reguła zamiast
    # dwóch, a przeglądarka widzi jeden origin, więc CORS nie wchodzi do gry.
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "app.name" . }}-web
                port:
                  number: 80
{{- end }}
