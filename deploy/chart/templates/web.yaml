apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.name" . }}-web
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- with .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "app.image" (dict "Values" .Values "component" "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.web.port }}
          env:
            # Nazwa usługi, nie adres — dokładnie to, po co istnieje ${API_UPSTREAM}
            # w nginx.conf.template. W compose wystarcza http://server:6210; tu pełna nazwa,
            # bo nginx sam ją rozwiązuje co kilka sekund i nie zna domen wyszukiwania
            # z /etc/resolv.conf, więc krótka nazwa usługi by nie zadziałała.
            - name: API_UPSTREAM
              value: http://{{ include "app.name" . }}-server.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.server.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.web.port }}
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.web.port }}
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.name" . }}-web
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
  ports:
    - port: 80
      targetPort: {{ .Values.web.port }}
