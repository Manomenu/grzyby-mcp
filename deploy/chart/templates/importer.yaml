{{- /*
Odświeżenie danych o lasach (grzyby_server/lasy/importer.py): drzewostany z BDL, parki
narodowe i rezerwaty z GDOŚ — tylko dla kwadratów, o które ktoś już pytał. Nowe okolice
dociąga sam serwer przy pierwszym pytaniu (lasy/tiles.py), więc świeża baza niczego nie
wymaga. Drzewostany zmieniają się raz w roku, parki prawie nigdy — stąd raz w miesiącu.
Zakazy wstępu nie idą tędy: serwer pobiera je sam przy zapytaniu.

Ten sam obraz co serwer, inna komenda. Odświeżenie od razu, bez czekania na harmonogram:
  kubectl -n <namespace> create job --from=cronjob/<release>-importer <release>-importer-now
*/ -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "app.name" . }}-importer
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: importer
spec:
  schedule: {{ .Values.importer.schedule | quote }}
  timeZone: Europe/Warsaw
  # Dwa importy naraz tylko by się blokowały w bazie.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      # Czas rośnie z liczbą odpytanych okolic (kilka sekund na kwadrat). Kwadrat, którego usługa
      # chwilowo nie oddała, zostaje ze starymi danymi, reszta idzie dalej — więc bez ponawiania
      # całości; kolejna próba za miesiąc albo ręcznie.
      backoffLimit: 0
      activeDeadlineSeconds: 21600
      template:
        metadata:
          labels:
            {{- include "app.labels" . | nindent 12 }}
            app.kubernetes.io/component: importer
        spec:
          restartPolicy: Never
          {{- with .Values.image.pullSecret }}
          imagePullSecrets:
            - name: {{ . }}
          {{- end }}
          containers:
            - name: importer
              image: {{ include "app.image" (dict "Values" .Values "component" "server") }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "-m", "grzyby_server.lasy.importer"]
              {{- with .Values.server.databaseSecret }}
              envFrom:
                - secretRef:
                    name: {{ . }}
              {{- end }}
              resources:
                {{- toYaml .Values.importer.resources | nindent 16 }}
