[project]
name = "grzyby-server"
version = "0.1.0"
description = "HTTP API"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115",            # HTTP API + OpenAPI schema the web client is typed from
    "mcp>=1.20",
    "psycopg[binary,pool]>=3.2", # PostgreSQL: plain SQL through a connection pool
    "pydantic>=2.9",             # request/response models and validation
    "pydantic-settings>=2.6",    # settings loaded from the layered .env files
    "uvicorn[standard]>=0.30",   # ASGI server
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grzyby_server"]
