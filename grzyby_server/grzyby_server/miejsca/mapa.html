<!doctype html>
<!--
  The map a chatbot shows under the answer of `gdzie_na_grzyby` (MCP Apps). Every forest stand
  around the place is coloured by one of four map modes — score, trees, age, site — with the areas
  one may not enter greyed out and the three best spots numbered.

  The host renders it in a sandboxed iframe under a strict CSP: scripts, styles and images only
  from the hosts listed in tools.py, no blob: workers. Hence Leaflet with raster tiles and a canvas
  for the stands — not a WebGL map. Links open through the host (app.openLink), as the sandbox may
  block new windows. Versions are pinned like every dependency here.

  The data is the tool's structuredContent (miejsca/model.py, Answer): the stands come column by
  column with outlines as encoded polylines, and with the scoring tables, so a popup explains a
  stand with the words and numbers its score came from. Colours are this file's business; rules
  are the server's.
-->
<html lang="pl">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <style>
            :root {
                color-scheme: light dark;
                font-family: system-ui, sans-serif;
                --line: color-mix(in srgb, currentColor 20%, transparent);
            }
            body {
                margin: 0;
            }
            .bar {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                align-items: center;
                padding: 8px 12px;
            }
            .bar button {
                font: inherit;
                font-size: 13px;
                padding: 4px 10px;
                border: 1px solid var(--line);
                border-radius: 999px;
                background: transparent;
                color: inherit;
                cursor: pointer;
            }
            .bar button[aria-pressed="true"] {
                background: #2f8a4a;
                border-color: #2f8a4a;
                color: white;
            }
            .bar .spacer {
                flex: 1;
            }
            #map {
                height: 420px;
            }
            body.fullscreen #map {
                height: calc(100vh - 160px);
            }
            .legend {
                background: rgb(255 255 255 / 0.92);
                color: #222;
                padding: 6px 8px;
                border-radius: 6px;
                font-size: 12px;
                line-height: 1.5;
                max-width: 220px;
            }
            .legend summary {
                cursor: pointer;
                font-weight: 600;
            }
            .legend i {
                display: inline-block;
                width: 12px;
                height: 12px;
                margin-right: 6px;
                vertical-align: -1px;
                border: 1px solid rgb(0 0 0 / 0.25);
            }
            .spot-number {
                display: grid;
                place-items: center;
                width: 24px;
                height: 24px;
                border-radius: 50%;
                background: #6b3e26;
                color: white;
                font: bold 13px system-ui, sans-serif;
                border: 2px solid white;
                box-shadow: 0 1px 3px rgb(0 0 0 / 0.4);
            }
            .popup p {
                margin: 4px 0;
            }
            ol,
            .notes {
                margin: 0;
                padding: 8px 12px 8px 32px;
                font-size: 14px;
            }
            .notes {
                list-style: none;
                padding-left: 12px;
            }
            li + li {
                margin-top: 6px;
            }
            a {
                color: #2f8a4a;
            }
            small {
                display: block;
                padding: 0 12px 8px;
                opacity: 0.7;
            }
        </style>
    </head>
    <body>
        <div class="bar" id="modes" role="group" aria-label="Tryb mapy">
            <button type="button" data-mode="wynik" aria-pressed="true">Wynik</button>
            <button type="button" data-mode="drzewa" aria-pressed="false">Drzewa</button>
            <button type="button" data-mode="wiek" aria-pressed="false">Wiek</button>
            <button type="button" data-mode="siedlisko" aria-pressed="false">Siedlisko</button>
            <button type="button" data-mode="pogoda" aria-pressed="false">Pogoda</button>
            <span class="spacer"></span>
            <button type="button" id="fullscreen" hidden>Pełny ekran</button>
        </div>
        <div class="bar" id="mushrooms" role="group" aria-label="Grzyb" hidden></div>
        <div id="map"></div>
        <ol id="list"></ol>
        <ul class="notes" id="notes"></ul>
        <small id="sources"></small>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script type="module">
            import { App } from "https://unpkg.com/@modelcontextprotocol/ext-apps@2.0.3/dist/src/app-with-deps.js";

            const L = window.L;

            // ── colours: one palette per map mode ────────────────────────────────────────
            // Score classes; points are 0–100 (map_data.py). Zero: the wrong tree, age or month.
            const WYNIK = [
                { below: 1, color: "#b0b0b0", label: "nie rośnie tu teraz" },
                { below: 25, color: "#f3ebc4", label: "słaby" },
                { below: 50, color: "#cfe3a0", label: "średni" },
                { below: 75, color: "#7fbf6a", label: "dobry" },
                { below: 101, color: "#2f8a4a", label: "bardzo dobry" },
            ];
            const DRZEWA = {
                SO: "#e3b23c",
                ŚW: "#2e6b4f",
                BRZ: "#ece6d6",
                DB: "#8a5a2b",
                BK: "#c4622d",
                OL: "#4f86b0",
                MD: "#a6b83a",
                OS: "#9b7cc0",
                GB: "#7d9c8a",
                LP: "#d18fb0",
            };
            const INNE_DRZEWO = "#9e9e9e";
            // Age classes follow the server's own (reguly.klasy_wieku); light to dark with age.
            const WIEK = ["#f1e7d0", "#d9b77e", "#a8743a", "#5e3b1a"];
            // Site groups are the server's (reguly.siedliska, reguly.grupy_siedlisk); only colours here.
            const SIEDLISKA = {
                bory_swieze: "#e9c46a",
                lasy_swieze: "#6aa84f",
                bory_suche: "#f4e3b5",
                wilgotne: "#76c7c0",
                bagienne: "#3d85c6",
                olsy_legi: "#1f4e79",
            };
            const INNE_SIEDLISKO = "#9e9e9e";
            // How wet the ground is over each tile of the grid (mapa.pogoda[tile].wilgoc, the
            // score's own formula), dry to soaked.
            const WILGOC = [
                { below: 0.2, color: "#efdcb3", label: "sucho" },
                { below: 0.5, color: "#cfe0b4", label: "lekko wilgotno" },
                { below: 0.8, color: "#7fb8c9", label: "wilgotno" },
                { below: 1.01, color: "#2f6f9f", label: "mokro" },
            ];

            // ── the map ───────────────────────────────────────────────────────────────────
            // Canvas, not SVG: two thousand polygons stay smooth. Quarter zoom steps, so the search
            // circle can fill the map instead of leaving the margin a whole step would.
            // trackResize off: the ResizeObserver below handles every size change, and Leaflet's own
            // handler panning at the same moment would cut the circle's fit short.
            const map = L.map("map", { preferCanvas: true, zoomSnap: 0.25, trackResize: false }).setView([54.1, 22.93], 10);
            // CARTO's tiles of OpenStreetMap data, with our key (tools.py puts it in): free up to 5 M
            // tiles a month, 1 M once we earn; both attributions must stay visible. Not OSM's own
            // tiles: they refuse requests without a Referer, and Codex on Windows sends none, and
            // their policy rules out a public app's traffic.
            L.tileLayer("https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=__CARTO_KEY__", {
                maxZoom: 19,
                attribution:
                    '© autorzy <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, © <a href="https://carto.com/attributions">CARTO</a>',
            }).addTo(map);
            const layers = L.layerGroup().addTo(map);
            // The weather mode's tiles, on the map only in that mode.
            const weatherLayer = L.layerGroup();
            // The numbered spots of the current view, above everything else.
            const spotLayer = L.layerGroup().addTo(map);
            // A legend that folds: on a phone, open, it would cover half the map. It starts open only
            // where there is room; a tap on "Legenda" opens or closes it.
            const legend = L.control({ position: "bottomleft" });
            legend.onAdd = () => {
                const box = L.DomUtil.create("details", "legend");
                box.open = !window.matchMedia("(max-width: 480px)").matches;
                L.DomEvent.disableClickPropagation(box);
                return box;
            };
            legend.addTo(map);

            let answer = null;
            let mode = "wynik";
            // The view: one of the mushrooms asked about, or "all" — the average of them all. Each view
            // has its own colours and its own numbered spots (the server picks them per view).
            let grzyb = "all";
            let stands = [];
            // The whole search circle is the first view — and stays so when the host resizes the
            // widget (it may start small and grow, or go full screen) until the user moves the map.
            let circleBounds = null;
            let moved = false;
            // Without animation: nothing left half-way when the next resize comes.
            const fitCircle = () => circleBounds && map.fitBounds(circleBounds, { padding: [8, 8], animate: false });
            for (const type of ["pointerdown", "wheel", "keydown"]) map.getContainer().addEventListener(type, () => (moved = true));
            new ResizeObserver(() => {
                map.invalidateSize();
                if (!moved) fitCircle();
            }).observe(map.getContainer());

            // Google's encoded polyline → [[lat, lon], …] (the server encodes with PostGIS).
            function decode(encoded) {
                const points = [];
                let index = 0;
                let lat = 0;
                let lon = 0;
                while (index < encoded.length) {
                    const deltas = [];
                    for (let k = 0; k < 2; k++) {
                        let shift = 0;
                        let result = 0;
                        let byte;
                        do {
                            byte = encoded.charCodeAt(index++) - 63;
                            result |= (byte & 0x1f) << shift;
                            shift += 5;
                        } while (byte >= 0x20);
                        deltas.push(result & 1 ? ~(result >> 1) : result >> 1);
                    }
                    lat += deltas[0];
                    lon += deltas[1];
                    points.push([lat / 1e5, lon / 1e5]);
                }
                return points;
            }
            const outline = (shape) => shape.map((rings) => rings.map(decode));

            const wynikClass = (points) => WYNIK.find((c) => points < c.below);
            const wiekClass = (rules, age) => rules.klasy_wieku.findIndex(([below]) => below === null || age < below);
            const siedliskoGroup = (rules, code) => rules.siedliska[code]?.[0];
            const scoreOf = (i) => {
                const columns = Object.values(answer.mapa.drzewostany.wynik).map((column) => column[i]);
                if (grzyb === "all") return Math.round(columns.reduce((a, b) => a + b, 0) / columns.length);
                return answer.mapa.drzewostany.wynik[grzyb][i];
            };

            function colorOf(i) {
                const d = answer.mapa.drzewostany;
                const rules = answer.mapa.reguly;
                if (mode === "wynik") return wynikClass(scoreOf(i)).color;
                if (mode === "drzewa") return DRZEWA[d.gatunek[i]] ?? INNE_DRZEWO;
                if (mode === "wiek") return WIEK[wiekClass(rules, d.wiek[i])];
                if (mode === "pogoda") return "#8a8a8a";
                return SIEDLISKA[siedliskoGroup(rules, d.siedlisko[i])] ?? INNE_SIEDLISKO;
            }

            function paint() {
                // In the weather mode the stands step back, so the tiles' colours show.
                const fillOpacity = mode === "pogoda" ? 0.15 : 0.8;
                stands.forEach((polygon, i) => polygon.setStyle({ fillColor: colorOf(i), fillOpacity }));
                if (mode === "pogoda") weatherLayer.addTo(map);
                else weatherLayer.remove();
                renderLegend();
            }

            function renderLegend() {
                const rows = [];
                const d = answer.mapa.drzewostany;
                const rules = answer.mapa.reguly;
                if (mode === "wynik") {
                    for (const c of WYNIK) rows.push([c.color, c.label]);
                } else if (mode === "drzewa") {
                    const present = [...new Set(d.gatunek)];
                    for (const code of present) rows.push([DRZEWA[code] ?? INNE_DRZEWO, rules.drzewa[code]?.[0] ?? "inne"]);
                } else if (mode === "wiek") {
                    let from = 0;
                    rules.klasy_wieku.forEach(([below, name], i) => {
                        const range = below === null ? `${from}+ lat` : `${from}–${below - 1} lat`;
                        rows.push([WIEK[i], `${range}: ${name}`]);
                        from = below;
                    });
                } else if (mode === "pogoda") {
                    for (const c of WILGOC) rows.push([c.color, c.label]);
                    rows.push([null, "deszcz 3–14 dni temu i wilgotność gleby (Open-Meteo)"]);
                } else {
                    for (const [group, name] of Object.entries(rules.grupy_siedlisk)) rows.push([SIEDLISKA[group] ?? INNE_SIEDLISKO, name]);
                }
                rows.push(["#808080", "tu nie wolno (park, rezerwat, zakaz)"]);
                // BDL describes the State Forests only; private and municipal woods are blank.
                rows.push([null, "tylko lasy państwowe (BDL)"]);
                const box = legend.getContainer();
                const summary = document.createElement("summary");
                summary.textContent = "Legenda";
                box.replaceChildren(summary);
                for (const [color, label] of rows) {
                    const line = document.createElement("div");
                    if (color) {
                        const swatch = document.createElement("i");
                        swatch.style.background = color;
                        line.append(swatch);
                    } else {
                        line.style.opacity = "0.7";
                    }
                    line.append(label);
                    box.append(line);
                }
            }

            function line(label, text) {
                const p = document.createElement("p");
                const b = document.createElement("b");
                b.textContent = `${label}: `;
                p.append(b, text);
                return p;
            }

            function popupFor(i, polygon) {
                const d = answer.mapa.drzewostany;
                const rules = answer.mapa.reguly;
                const [treeName, adjective] = rules.drzewa[d.gatunek[i]] ?? ["inne drzewo", "mieszany"];
                const [, siteName] = rules.siedliska[d.siedlisko[i]] ?? [null, "siedlisko nieznane"];
                const [, ageName] = rules.klasy_wieku[wiekClass(rules, d.wiek[i])];
                const box = document.createElement("div");
                box.className = "popup";
                const title = document.createElement("b");
                title.textContent = `Las ${adjective}`;
                box.append(title);
                // The score for every mushroom asked about, the best first.
                const scores = Object.entries(d.wynik)
                    .map(([g, column]) => [rules.grzyby[g].nazwa, column[i]])
                    .sort((a, b) => b[1] - a[1]);
                for (const [name, points] of scores) box.append(line(name, `${wynikClass(points).label} (${points}/100)`));
                box.append(
                    line("Drzewa", treeName),
                    line("Siedlisko", `${d.siedlisko[i] ?? "?"} — ${siteName}`),
                    line("Wiek", `${d.wiek[i]} lat — ${ageName}`),
                );
                const center = polygon.getBounds().getCenter();
                box.append(routeLink(`https://www.google.com/maps/dir/?api=1&destination=${center.lat.toFixed(6)},${center.lng.toFixed(6)}`));
                return box;
            }

            function routeLink(url) {
                const link = document.createElement("a");
                link.href = url;
                link.textContent = "trasa w Google Maps";
                link.addEventListener("click", (event) => {
                    event.preventDefault();
                    app.openLink({ url }).catch(() => window.open(url, "_blank", "noopener"));
                });
                return link;
            }

            function show(result) {
                answer = result;
                layers.clearLayers();
                stands = [];
                const bounds = L.latLngBounds([]);
                const m = answer.mapa;
                circleBounds = null;
                if (m) {
                    const center = [m.lat, m.lon];
                    // SVG, unlike the stands: one element, which the browser test can measure.
                    L.circle(center, {
                        radius: answer.promien_km * 1000,
                        color: "#6b3e26",
                        weight: 1,
                        dashArray: "4 6",
                        fill: false,
                        interactive: false,
                        className: "search-radius",
                        renderer: L.svg(),
                    }).addTo(layers);
                    circleBounds = L.latLng(center).toBounds(answer.promien_km * 2000);
                    m.drzewostany.ksztalt.forEach((shape, i) => {
                        // A faint outline: a thousand dark borders would turn the forest into a grid.
                        const polygon = L.polygon(outline(shape), { weight: 0.4, color: "#000", opacity: 0.25, fillOpacity: 0.8 });
                        polygon.bindPopup(() => popupFor(i, polygon));
                        polygon.addTo(layers);
                        stands.push(polygon);
                    });
                    weatherLayer.clearLayers();
                    const [tileLat, tileLon] = m.kwadrat;
                    for (const [tile, w] of Object.entries(m.pogoda)) {
                        const [row, col] = tile.split("_").map(Number);
                        const soil = w.wilgotnosc_gleby === null ? "" : `, gleba ${w.wilgotnosc_gleby.toFixed(2)} m³/m³`;
                        L.rectangle(
                            [
                                [row * tileLat, col * tileLon],
                                [(row + 1) * tileLat, (col + 1) * tileLon],
                            ],
                            { color: "#2f6f9f", weight: 0.5, fillColor: WILGOC.find((c) => w.wilgoc < c.below).color, fillOpacity: 0.55 },
                        )
                            .bindTooltip(`${w.opad} mm deszczu 3–14 dni temu${soil}, średnio ${w.temperatura} °C`, { sticky: true })
                            .addTo(weatherLayer);
                    }
                    // Above the stands, so their grey and their name win.
                    for (const area of m.obszary) {
                        L.polygon(outline(area.ksztalt), { color: "#555", weight: 1.5, dashArray: "5 4", fillColor: "#808080", fillOpacity: 0.45 })
                            .bindTooltip(`${area.nazwa} — tu nie wolno`, { sticky: true })
                            .addTo(layers);
                    }
                }
                for (const spot of answer.miejsca) bounds.extend([spot.lat, spot.lon]);
                moved = false;
                if (circleBounds) fitCircle();
                else if (bounds.isValid()) map.fitBounds(bounds, { padding: [20, 20] });
                if (m) {
                    renderMushrooms();
                    paint();
                }
                renderSpots();
                const notes = document.getElementById("notes");
                notes.replaceChildren();
                for (const note of answer.uwagi) {
                    const item = document.createElement("li");
                    item.textContent = `⚠ ${note}`;
                    notes.append(item);
                }
                document.getElementById("sources").textContent = answer.zrodla;
            }

            // The numbered spots and the list under the map, for the current view: the shared ones
            // ("all", or the only mushroom) or one mushroom's own.
            function renderSpots() {
                const spots = grzyb === "all" || !answer.miejsca_na_grzyb?.[grzyb] ? answer.miejsca : answer.miejsca_na_grzyb[grzyb];
                spotLayer.clearLayers();
                spots.forEach((spot, i) => {
                    L.marker([spot.lat, spot.lon], {
                        icon: L.divIcon({ className: "", html: `<div class="spot-number">${i + 1}</div>`, iconSize: [24, 24] }),
                        title: spot.nazwa,
                        zIndexOffset: 1000,
                    })
                        .bindPopup(spot.nazwa)
                        .addTo(spotLayer);
                });
                const list = document.getElementById("list");
                list.replaceChildren();
                for (const spot of spots) {
                    const item = document.createElement("li");
                    const name = document.createElement("b");
                    name.textContent = spot.nazwa;
                    item.append(name, ` — ${spot.dlaczego} `, routeLink(spot.trasa));
                    list.append(item);
                }
            }

            // One button per mushroom asked about and, when there are several, "wszystkie" (their average).
            function renderMushrooms() {
                const bar = document.getElementById("mushrooms");
                const asked = Object.keys(answer.mapa.drzewostany.wynik);
                const together = asked.length > 1 ? [["all", "wszystkie"]] : [];
                if (!asked.includes(grzyb) && !(together.length && grzyb === "all")) grzyb = together.length ? "all" : asked[0];
                const choices = [...together, ...asked.map((g) => [g, answer.mapa.reguly.grzyby[g].nazwa])];
                bar.replaceChildren(
                    ...choices.map(([key, name]) => {
                        const button = document.createElement("button");
                        button.type = "button";
                        button.textContent = name;
                        button.setAttribute("aria-pressed", String(key === grzyb));
                        button.addEventListener("click", () => {
                            grzyb = key;
                            for (const b of bar.children) b.setAttribute("aria-pressed", String(b === button));
                            paint();
                            renderSpots();
                        });
                        return button;
                    }),
                );
                bar.hidden = false;
            }

            for (const button of document.querySelectorAll("#modes [data-mode]")) {
                button.addEventListener("click", () => {
                    mode = button.dataset.mode;
                    for (const b of document.querySelectorAll("#modes [data-mode]")) b.setAttribute("aria-pressed", String(b === button));
                    if (answer?.mapa) paint();
                });
            }

            // ── the host ──────────────────────────────────────────────────────────────────
            const app = new App({ name: "grzyby-mapa", version: "0.2.0" }, { availableDisplayModes: ["inline", "fullscreen"] });
            // Before connect(): the host may send the result right away.
            app.ontoolresult = (result) => {
                if (result.structuredContent) show(result.structuredContent);
            };

            // Full screen only where the host offers it (spec: check availableDisplayModes first).
            const fullscreen = document.getElementById("fullscreen");
            function onDisplayMode(displayMode) {
                const full = displayMode === "fullscreen";
                document.body.classList.toggle("fullscreen", full);
                fullscreen.textContent = full ? "Zamknij pełny ekran" : "Pełny ekran";
                map.invalidateSize();
            }
            fullscreen.addEventListener("click", async () => {
                const full = document.body.classList.contains("fullscreen");
                const result = await app.requestDisplayMode({ mode: full ? "inline" : "fullscreen" });
                onDisplayMode(result.mode);
            });
            app.onhostcontextchanged = (context) => {
                if (context.displayMode) onDisplayMode(context.displayMode);
            };
            await app.connect();
            fullscreen.hidden = !app.getHostContext()?.availableDisplayModes?.includes("fullscreen");
        </script>
    </body>
</html>
