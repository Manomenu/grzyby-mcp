<!doctype html>
<!--
  The map a chatbot shows under the answer of `gdzie_na_grzyby` (MCP Apps, ui://grzyby/mapa.html).
  The host renders it in a sandboxed iframe under a strict CSP: scripts, styles and images only
  from the hosts listed in tools.py, no blob: workers. Hence Leaflet with raster tiles — plain
  <img> elements — and not a WebGL map. Versions are pinned like every dependency here.
-->
<html lang="pl">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <style>
            :root {
                color-scheme: light dark;
                font-family: system-ui, sans-serif;
            }
            body {
                margin: 0;
            }
            #map {
                height: 360px;
            }
            ul {
                margin: 0;
                padding: 8px 12px;
                list-style: none;
                font-size: 14px;
            }
            li + li {
                margin-top: 6px;
            }
            small {
                display: block;
                padding: 0 12px 8px;
                opacity: 0.7;
            }
        </style>
    </head>
    <body>
        <div id="map"></div>
        <ul id="list"></ul>
        <small id="sources"></small>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script type="module">
            import { App } from "https://unpkg.com/@modelcontextprotocol/ext-apps@2.0.3/dist/src/app-with-deps.js";

            const L = window.L;
            // Suwałki until the first result arrives.
            const map = L.map("map").setView([54.1, 22.93], 10);
            // OpenStreetMap's own tiles: no key, attribution required. Fine for a hobby's traffic;
            // their usage policy rules out heavy use — a busier map gets its own tile source.
            L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
                maxZoom: 19,
                attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
            }).addTo(map);

            function show(answer) {
                const list = document.getElementById("list");
                list.replaceChildren();
                const points = [];
                for (const spot of answer.miejsca) {
                    // A circle, not the default pin: the pin is an image Leaflet looks up by path.
                    L.circleMarker([spot.lat, spot.lon], { radius: 10, color: "#6b3e26", fillOpacity: 0.6 })
                        .bindPopup(spot.nazwa)
                        .addTo(map);
                    points.push([spot.lat, spot.lon]);

                    const item = document.createElement("li");
                    const link = document.createElement("a");
                    link.href = spot.trasa;
                    link.target = "_blank";
                    link.rel = "noopener";
                    link.textContent = "trasa";
                    const name = document.createElement("b");
                    name.textContent = spot.nazwa;
                    item.append(name, ` — ${spot.dlaczego} `, link);
                    list.append(item);
                }
                if (points.length) map.fitBounds(points, { padding: [60, 60], maxZoom: 13 });
                document.getElementById("sources").textContent = answer.zrodla;
            }

            const app = new App({ name: "grzyby-mapa", version: "0.1.0" });
            // Before connect(): the host may send the result right away.
            app.ontoolresult = (result) => {
                if (result.structuredContent) show(result.structuredContent);
            };
            app.connect();
        </script>
    </body>
</html>
